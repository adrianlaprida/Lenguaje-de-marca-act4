<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarjeta gráfica</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main>
        <article>
            <h1>AMD Radeon RX 7800 XT</h1>
            <h2>Ficha técnica</h2>

            <h3>Características</h3>

            <table>
                <tr>
                    <th>Característica</th>
                    <th>Dato</th>
                </tr>
                <tr>
                    <td>Memoria</td>
                    <td>16 GB</td>
                </tr>
                <tr>
                    <td>Consumo</td>
                    <td>263 W</td>
                </tr>
                <tr>
                    <td>Conexión</td>
                    <td>PCI Express 4.0</td>
                </tr>
            </table>

            <h3>Ventajas</h3>

            <ul>
                <li>Buena para jugar.</li>
                <li>Tiene mucha memoria.</li>
                <li>Permite jugar a alta resolución.</li>
            </ul>
        </article>
    </main>

</body>
</html>
